[project]
name = "construire-agent-ia-python"
version = "1.0.0"
description = "Code source des exemples du livre « Construire un agent IA en Python » — chaque script correspond à un chapitre, voir le livre pour le contexte."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "mcp>=2.0.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
